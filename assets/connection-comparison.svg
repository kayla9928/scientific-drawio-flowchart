<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
<title id="title">正确与错误连接的局部对照</title>
<desc id="desc">依据合成案例中的实际节点和连接重绘。左侧已核对补全记录进入汇合，右侧错误地将无法补全的排除记录连接到汇合。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="470" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172b3a">
<rect x="12" y="12" width="526" height="446" rx="16" fill="#f8fafc" stroke="#dce4ed"/><text x="275" y="49" font-size="24" fill="#256b51" text-anchor="middle">正确连接</text><rect x="35" y="82" width="220" height="76" rx="10" fill="#edf4fb" stroke="#456786" stroke-width="1.5"/><text x="145" y="113" font-size="18" fill="#172b3a" text-anchor="middle">已核对补全</text><text x="145" y="138" font-size="18" fill="#172b3a" text-anchor="middle">10条</text><rect x="295" y="82" width="220" height="76" rx="10" fill="#fff2e8" stroke="#a65d2d" stroke-width="1.5"/><text x="405" y="113" font-size="18" fill="#172b3a" text-anchor="middle">无法补全：排除</text><text x="405" y="138" font-size="18" fill="#172b3a" text-anchor="middle">10条</text><path d="M 145 158 V 211 H 275 V 258" fill="none" stroke="#256b51" stroke-width="3" marker-end="url(#arrow)"/><rect x="165" y="260" width="220" height="76" rx="10" fill="#edf4fb" stroke="#456786" stroke-width="1.5"/><text x="275" y="291" font-size="18" fill="#172b3a" text-anchor="middle">合并可用记录</text><text x="275" y="316" font-size="18" fill="#172b3a" text-anchor="middle">70条</text><text x="275" y="374" font-size="17" fill="#256b51" text-anchor="middle">可用记录进入汇合；排除记录在此结束</text><text x="275" y="415" font-size="14" fill="#64748b" text-anchor="middle">案例局部连接示意</text><rect x="562" y="12" width="526" height="446" rx="16" fill="#f8fafc" stroke="#dce4ed"/><text x="825" y="49" font-size="24" fill="#bd3d35" text-anchor="middle">错误连接</text><rect x="585" y="82" width="220" height="76" rx="10" fill="#edf4fb" stroke="#456786" stroke-width="1.5"/><text x="695" y="113" font-size="18" fill="#172b3a" text-anchor="middle">已核对补全</text><text x="695" y="138" font-size="18" fill="#172b3a" text-anchor="middle">10条</text><rect x="845" y="82" width="220" height="76" rx="10" fill="#fff2e8" stroke="#a65d2d" stroke-width="1.5"/><text x="955" y="113" font-size="18" fill="#172b3a" text-anchor="middle">无法补全：排除</text><text x="955" y="138" font-size="18" fill="#172b3a" text-anchor="middle">10条</text><path d="M 955 158 V 211 H 825 V 258" fill="none" stroke="#bd3d35" stroke-width="3" marker-end="url(#arrow)"/><rect x="715" y="260" width="220" height="76" rx="10" fill="#edf4fb" stroke="#456786" stroke-width="1.5"/><text x="825" y="291" font-size="18" fill="#172b3a" text-anchor="middle">合并可用记录</text><text x="825" y="316" font-size="18" fill="#172b3a" text-anchor="middle">70条</text><text x="825" y="374" font-size="17" fill="#bd3d35" text-anchor="middle">排除记录被接入汇合；应有路径缺失</text><text x="825" y="415" font-size="14" fill="#64748b" text-anchor="middle">案例局部连接示意</text></g></svg>